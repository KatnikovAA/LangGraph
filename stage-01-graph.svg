<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52647c"/></marker></defs>
<rect width="1200" height="860" fill="#f5f7fb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#192b43">
<text x="60" y="65" font-size="32" font-weight="700">Исследовательский ассистент · Этап 1</text>
<text x="60" y="105" font-size="20">Приём темы → проверка → подготовка заявки</text>
<rect x="60" y="150" width="680" height="650" rx="24" fill="white" stroke="#d9e1ee"/>
<text x="90" y="193" font-size="20" font-weight="600">Граф выполнения</text>
<g stroke="#52647c" stroke-width="3" marker-end="url(#arrow)">
<path d="M400 275 V320"/><path d="M400 425 V480"/><path d="M400 585 V640"/>
</g>
<rect x="310" y="225" width="180" height="50" rx="25" fill="#e8edf5"/>
<text x="400" y="258" text-anchor="middle" font-size="21">START</text>
<rect x="150" y="325" width="500" height="100" rx="16" fill="#e3efff" stroke="#6596db"/>
<text x="400" y="361" text-anchor="middle" font-size="23" font-weight="600">validate_topic</text>
<text x="400" y="394" text-anchor="middle" font-size="18">Убрать лишние пробелы, проверить тему</text>
<rect x="150" y="485" width="500" height="100" rx="16" fill="#def3eb" stroke="#66a88c"/>
<text x="400" y="522" text-anchor="middle" font-size="23" font-weight="600">prepare_request</text>
<text x="400" y="555" text-anchor="middle" font-size="18">Создать заявку со статусом ready</text>
<rect x="310" y="645" width="180" height="50" rx="25" fill="#e8edf5"/>
<text x="400" y="678" text-anchor="middle" font-size="21">END</text>
<text x="100" y="748" font-size="17" fill="#9a4343">Пустая тема → ValueError → сообщение в CLI</text>
<text x="100" y="776" font-size="16" fill="#52647c">Ошибка завершает запуск; это не отдельное ребро графа.</text>
<rect x="775" y="150" width="365" height="325" rx="22" fill="#192b43"/>
<g fill="white"><text x="800" y="190" font-size="21" font-weight="600">State: общие данные</text>
<text x="800" y="237" font-size="18">topic → исходный ввод</text>
<text x="800" y="278" font-size="18">normalized_topic → тема</text>
<text x="800" y="319" font-size="18">status → ready</text>
<text x="800" y="370" font-size="17">Узел получает состояние</text>
<text x="800" y="400" font-size="17">и возвращает обновления.</text>
<text x="800" y="444" font-size="17">Исходная тема сохраняется.</text></g>
<rect x="775" y="505" width="365" height="295" rx="22" fill="white" stroke="#d9e1ee"/>
<text x="800" y="550" font-size="21" font-weight="600">Сборка и запуск</text>
<text x="800" y="598" font-size="20">StateGraph(State)</text>
<text x="800" y="632" font-size="18">→ узлы + рёбра</text>
<text x="800" y="666" font-size="20">→ compile()</text>
<text x="800" y="700" font-size="20">→ invoke({topic: ...})</text>
<text x="800" y="755" font-size="17" fill="#52647c">Результат → JSON в терминале</text>
</g></svg>
