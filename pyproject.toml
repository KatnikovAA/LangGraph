[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-research-assistant"
version = "0.1.0"
description = "Prepare technical research requests with LangGraph"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2.0"]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["research_assistant*"]
