[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-research-assistant"
version = "0.1.0"
description = "Plan technical research with LangGraph and Polza AI"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.1.2,<4.0",
    "langchain-openai>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "tavily-python>=0.8.5,<1.0",
    "requests>=2.32,<3.0",
]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[project.optional-dependencies]
studio = ["langgraph-cli[inmem]>=0.4,<1.0"]
web = ["langgraph-cli[inmem]==0.4.37", "langgraph-api==0.16.2", "langgraph-sdk==0.4.8", "starlette==1.9.0", "uvicorn>=0.34,<1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["research_assistant*"]

[tool.setuptools.package-data]
"research_assistant.web" = ["static/*"]
