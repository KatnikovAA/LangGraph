[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-research-assistant"
version = "0.1.0"
description = "Plan technical research with LangGraph and Polza AI"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "langchain-openai>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "tavily-python>=0.8.5,<1.0",
    "requests>=2.32,<3.0",
]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["research_assistant*"]
