<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1450" viewBox="0 0 1500 1450">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#60718b"/></marker></defs>
<rect width="1500" height="1450" fill="#f3f6fb"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#192b43">
<text x="65" y="70" font-size="38" font-weight="700">LangGraph: от описания процесса до результата</text>
<text x="65" y="112" font-size="23">Конструктор → исполняемый граф → запуск с данными → результат</text>
<rect x="55" y="145" width="1390" height="370" rx="22" fill="white" stroke="#d6dfec"/>
<text x="85" y="190" font-size="27" font-weight="700">1. Создаём и запускаем граф</text>
<rect x="85" y="218" width="410" height="160" rx="14" fill="#e4edff"/>
<text x="105" y="254" font-size="22" font-weight="600">builder = StateGraph(State)</text>
<text x="105" y="291" font-size="20">StateGraph — класс.</text>
<text x="105" y="322" font-size="20">builder — экземпляр: конструктор.</text>
<text x="105" y="353" font-size="20">Создание объекта, не наследование.</text>
<rect x="545" y="218" width="360" height="160" rx="14" fill="#dff3eb"/>
<text x="565" y="254" font-size="22" font-weight="600">graph = builder.compile()</text>
<text x="565" y="291" font-size="20">Собрать исполняемый граф</text>
<text x="565" y="322" font-size="20">из описанных узлов и связей.</text>
<text x="565" y="353" font-size="20">Обработка данных ещё не идёт.</text>
<rect x="955" y="218" width="460" height="160" rx="14" fill="#fff0d8"/>
<text x="975" y="254" font-size="22" font-weight="600">result = graph.invoke(input_data)</text>
<text x="975" y="291" font-size="20">Запустить собранный граф.</text>
<text x="975" y="322" font-size="20">input_data — входной словарь.</text>
<text x="975" y="353" font-size="20">result — итоговые данные запуска.</text>
<g stroke="#60718b" stroke-width="3" marker-end="url(#a)"><path d="M500 295 H535"/><path d="M910 295 H945"/></g>
<text x="85" y="422" font-size="21">До compile(): add_node(...) регистрирует узлы; add_edge(...) задаёт переходы.</text>
<text x="85" y="458" font-size="21">Один собранный graph можно запускать с разными темами через invoke().</text>
<text x="85" y="491" font-size="20" fill="#a24637">Правильно: compile(). Название complete() здесь ошибочно — этот метод мы не используем.</text>
<rect x="55" y="545" width="1390" height="220" rx="22" fill="white" stroke="#d6dfec"/>
<text x="85" y="590" font-size="27" font-weight="700">2. Маршрут выполнения: четыре блока, две рабочие функции</text>
<g stroke="#60718b" stroke-width="3" marker-end="url(#a)"><path d="M290 655 H365"/><path d="M705 655 H780"/><path d="M1120 655 H1195"/></g>
<rect x="95" y="620" width="195" height="70" rx="35" fill="#e9eef6"/>
<text x="192" y="664" font-size="25" text-anchor="middle">START</text>
<rect x="375" y="620" width="330" height="70" rx="14" fill="#e4edff"/>
<text x="540" y="664" font-size="25" text-anchor="middle">validate_topic</text>
<rect x="790" y="620" width="330" height="70" rx="14" fill="#dff3eb"/>
<text x="955" y="664" font-size="25" text-anchor="middle">prepare_request</text>
<rect x="1205" y="620" width="195" height="70" rx="35" fill="#e9eef6"/>
<text x="1302" y="664" font-size="25" text-anchor="middle">END</text>
<text x="85" y="735" font-size="21">START / END — вход и завершение. Стрелки — рёбра. compile() и invoke() не являются узлами.</text>
<rect x="55" y="795" width="1390" height="340" rx="22" fill="#192b43"/>
<g fill="white"><text x="85" y="840" font-size="27" font-weight="700">3. State — текущие данные всего запуска, а не только вход</text>
<text x="85" y="882" font-size="21">Представь карточку исследования: каждый узел читает её и возвращает обновления полей.</text>
<text x="85" y="932" font-size="21" font-weight="600">На входе</text>
<text x="530" y="932" font-size="21" font-weight="600">После validate_topic</text>
<text x="975" y="932" font-size="21" font-weight="600">После prepare_request</text>
<g font-family="Consolas, monospace" font-size="19"><text x="85" y="970">topic: "  AI   Agents  "</text>
<text x="530" y="970">topic: "  AI   Agents  "</text><text x="530" y="1003">normalized_topic: "AI Agents"</text>
<text x="975" y="970">topic: "  AI   Agents  "</text><text x="975" y="1003">normalized_topic: "AI Agents"</text><text x="975" y="1036">status: "ready"</text></g>
<text x="85" y="1085" font-size="21">State меняется по ходу выполнения: поля добавляются, их значения могут обновляться.</text>
<text x="85" y="1115" font-size="19" fill="#c4d4ec">В нашем коде узлы не мутируют входной словарь: возвращают изменения, которые применяет LangGraph.</text></g>
<rect x="55" y="1165" width="1390" height="225" rx="22" fill="white" stroke="#d6dfec"/>
<text x="85" y="1210" font-size="27" font-weight="700">4. TypedDict — описание формы данных</text>
<text x="85" y="1253" font-size="22">State — имя схемы; state — обычно имя переменной с конкретными данными.</text>
<text x="85" y="1292" font-size="22">TypedDict задаёт ключи и типы: topic — строка, normalized_topic — необязательная строка.</text>
<text x="85" y="1331" font-size="22">По смыслу похож на type / interface объекта в TypeScript. Во время выполнения это словарь.</text>
<text x="85" y="1368" font-size="20" fill="#52647c">Сам TypedDict не проверяет реальный ввод. Проверку пустой темы выполняет validate_topic.</text>
</g></svg>
